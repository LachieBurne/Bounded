name: Update Card Prices

on:
  schedule:
    # Daily, just after JustTCG's midnight-UTC daily reset. Each run spends at most
    # 30 requests on the cards that are due (see scripts/update_prices.py), which
    # keeps a month to ~500 of the free tier's 1,000.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Max JustTCG requests for this run
        default: '30'

permissions:
  contents: write
  # To start the Pages deploy: pushes made with GITHUB_TOKEN don't trigger workflows.
  actions: write

# Never let two price runs push at the same time.
concurrency:
  group: update-card-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch prices
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          PRICE_REQUEST_BUDGET: ${{ inputs.budget || '30' }}
        run: python scripts/update_prices.py

      - name: Upload prices artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prices-backup
          path: |
            prices.json
            data/price_state.json
          if-no-files-found: warn

      # Runs after a partial failure too: the script only writes progress it made.
      - name: Commit and push
        id: push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "PriceBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json data/price_state.json
          if git diff --cached --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          git commit -m "Update prices [Automated]"
          # Rebase in case someone pushed while the job was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the new prices
        if: steps.push.outputs.pushed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_pages.yml --ref main
