name: Update Card Prices

on:
  schedule:
    # 00:00 UTC on Mon, Wed, Fri (~450 JustTCG requests/month)
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

# Never let two price runs push at the same time.
concurrency:
  group: update-card-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch prices
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
        run: python scripts/update_prices.py

      - name: Upload prices artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prices-backup
          path: prices.json
          if-no-files-found: warn

      - name: Commit and push
        run: |
          git config user.name "PriceBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          git commit -m "Update prices [Automated]"
          # Rebase in case someone pushed while the job was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
