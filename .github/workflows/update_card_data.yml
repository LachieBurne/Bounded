name: Update Card Data

on:
  schedule:
    # Sundays 06:00 UTC: pick up newly revealed cards.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-card-data
  cancel-in-progress: false

env:
  BRANCH: automation/card-data

jobs:
  update-card-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate card data
        run: python scripts/generate_card_data.py | tee generate.log

      - name: Open or update a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add card_images "Android App/app/src/main/assets/riftbound_data.json" "Web App/public/riftbound_data.json" docs/unknown-artists.md
          if git diff --cached --quiet; then
            echo "Card data unchanged."
            exit 0
          fi

          git config user.name "CardDataBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "Update card data [Automated]"
          git push --force origin "$BRANCH"

          {
            echo "Automated update from the official card gallery."
            echo
            echo '```'
            grep -E "^(Gallery|Images|Changes|warning|note):" generate.log || true
            echo '```'
            echo
            echo "Review new cards, then merge. Checks don't run automatically on bot PRs; close and reopen this PR to run them."
          } > pr_body.md

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file pr_body.md
          else
            gh pr create --head "$BRANCH" --base "${GITHUB_REF_NAME}" \
              --title "Update card data" --body-file pr_body.md
          fi
